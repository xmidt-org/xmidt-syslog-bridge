---
# The shared-go CI workflow runs `go test ./...` and offers no way to pass a
# build tag, so the integration suite needs a workflow of its own.  GitHub's
# ubuntu runners provide a Docker daemon, which is what testcontainers needs.
name: Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run the integration tests
        run: make test-integration
